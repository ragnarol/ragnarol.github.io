title: RPG Campaign Summaries
markdown: kramdown
kramdown:
  hard_wrap: true
exclude: [source, README.md, CNAME, Gemfile, Gemfile.lock]
langs: [en, es]


defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: "*/search.json"
    values:
      layout: false
  - scope:
      path: "es"
    values:
      lang: es
  - scope:
      path: "en"
    values:
      lang: en
  - scope:
      path: "es/pirates-of-drinax"
    values:
      theme: sci-fi
  - scope:
      path: "en/pirates-of-drinax"
    values:
      theme: sci-fi
  - scope:
      path: "es/ravenloft"
    values:
      theme: gothic
  - scope:
      path: "en/ravenloft"
    values:
      theme: gothic
